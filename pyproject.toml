[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-athlete-tracking"
version = "1.0.0"
description = "Association football player and athlete tracking with tactical performance analytics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Shreesha Anand Pujar", email = "shreeshaanandpujar@gmail.com"}
]
keywords = [
  "computer-vision",
  "athlete-tracking",
  "multi-object-tracking",
  "sports-analytics",
  "yolov8",
  "botsort",
  "soccernet",
  "football"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "ultralytics>=8.0.0",
  "opencv-python>=4.8.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "matplotlib>=3.7.0",
  "tabulate>=0.9.0",
  "pyyaml>=6.0",
  "tqdm>=4.65.0",
  "scikit-learn>=1.3.0"
]

[project.urls]
"Homepage" = "https://github.com/shreeshaanandpujar/football-athlete-tracking"
"LinkedIn" = "https://www.linkedin.com/in/shreesha-anand-pujar-ba1b96369/"
